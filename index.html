        <a href="index.html?id=%D0%B2%D0%BE%D0%B4%D0%BA%D0%B0%20%D0%B1%D0%B5%D1%82%20%D0%BE%D1%84%D0%B8%D1%86%D0%B8%D0%B0%D0%BB%D1%8C%D0%BD%D1%8B%D0%B9" rel="tag">водка бет официальный</a>
      </div>
    </div>
  </noscript>

  <script src="tags.js"></script>
  <script>
    (function () {
      const app = document.getElementById("app");
      const PT = window.PageTags;

      function el(tag, attrs, children) {
        const node = document.createElement(tag);
        if (attrs) {
          Object.entries(attrs).forEach(([k, v]) => {
            if (k === "className") node.className = v;
            else if (k === "text") node.textContent = v;
            else if (k === "html") node.innerHTML = v;
            else if (v != null) node.setAttribute(k, v);
          });
        }
        (children || []).forEach((c) => {
          if (c == null) return;
          node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
        });
        return node;
      }

      function applyMeta(site) {
        document.title = site.title || document.title;
        document.documentElement.lang = site.lang || "ru";
        document.documentElement.setAttribute("translate", site.translate || "yes");
        const map = {
          description: site.description,
          keywords: (site.keywords || []).join(", "),
          author: site.author,
          robots: site.robots
        };
        Object.entries(map).forEach(([name, content]) => {
          if (!content) return;
          let m = document.querySelector(`meta[name="${name}"]`);
          if (!m) {
            m = document.createElement("meta");
            m.setAttribute("name", name);
            document.head.appendChild(m);
          }
          m.setAttribute("content", content);
        });
      }

      function openTranslate(lang) {
        if (!lang || lang === "ru") return;
        const url = "https://translate.google.com/translate?hl=" + encodeURIComponent(lang) +
          "&sl=ru&tl=" + encodeURIComponent(lang) + "&u=" + encodeURIComponent(location.href);
        window.open(url, "_blank", "noopener,noreferrer");
      }

      function render(data) {
        const site = data.site || {};
        const hero = data.hero || {};
        applyMeta(site);

        if (PT) {
          PT.mergePageTags(data);
        }
        const activeId = PT ? PT.getIdFromUrl() : "";
        if (PT) PT.applyActiveTag(activeId);

        const nav = el("nav", { className: "nav", "aria-label": "Навигация" },
          (data.nav || []).map((item) =>
            el("a", {
              href: item.href,
              target: item.external ? "_blank" : null,
              rel: item.external ? "noopener noreferrer" : null,
              text: item.label
            })
          )
        );

        const translate = el("label", { className: "translate-box" }, [
          document.createTextNode("Перевод"),
          el("select", { "aria-label": "Перевести страницу", id: "lang-select" }, [
            el("option", { value: "ru", text: "RU" }),
            el("option", { value: "en", text: "EN" }),
            el("option", { value: "uk", text: "UK" }),
            el("option", { value: "de", text: "DE" }),
            el("option", { value: "es", text: "ES" }),
            el("option", { value: "tr", text: "TR" })
          ])
        ]);

        const header = el("header", { className: "top" }, [
          el("div", { className: "shell top-inner" }, [
            el("a", { href: "index.html?id=vodka bet", className: "brand", html: 'Vodka <span>Bet</span>' }),
            nav,
            translate
          ])
        ]);

        const media = data.media || {};
        const pictureSrc = media.pictureSrc || "vodkabet.avif";
        const videoSrc = media.videoSrc || "водка-бет.webm";
        const pictureHref = media.pictureHref || "https://www.justinfo.si/index.html?id=vodka-bet-picture";
        const videoHref = media.videoHref || "https://www.justinfo.si/index.html?id=vodka-bet-video";

        const frame = el("div", { className: "media-frame" });
        const poster = el("img", {
          className: "media-poster",
          src: pictureSrc,
          alt: "Водка Бет",
          width: "1280",
          height: "720",
          loading: "lazy"
        });
        const posterLink = el("a", {
          className: "media-poster-link",
          href: pictureHref
        }, [poster]);
        const playBtn = el("button", {
          className: "media-play",
          type: "button",
          "aria-label": "Смотреть"
        });
        const videoEl = el("video", {
          controls: "controls",
          playsinline: "playsinline",
          preload: "none"
        });
        const videoLink = el("a", {
          className: "media-video-link",
          href: videoHref
        }, [videoEl]);

        function startVideo(e) {
          if (e) e.preventDefault();
          if (frame.classList.contains("is-playing")) return;
          videoEl.src = videoSrc;
          frame.classList.add("is-playing");
          videoEl.play().catch(function () {});
        }

        playBtn.addEventListener("click", startVideo);
        posterLink.addEventListener("click", startVideo);
        videoLink.addEventListener("click", function (e) { e.preventDefault(); });
        frame.appendChild(videoLink);
        frame.appendChild(posterLink);
        frame.appendChild(playBtn);

        const heroNode = el("section", { className: "hero shell", id: "top" }, [
          el("div", { className: "hero-copy" }, [
            el("p", { className: "hero-brand", html: 'Vodka <em>Bet</em>' }),
            el("h1", { text: activeId ? (PT.findTag(activeId) || activeId) : (hero.headline || "Водка Бет") }),
            el("p", { text: hero.text || "" }),
            el("div", { className: "cta-row" }, [
              hero.ctaPrimary ? el("a", {
                className: "btn btn-primary",
                href: hero.ctaPrimary.href,
                target: "_blank",
                rel: "noopener noreferrer",
                text: hero.ctaPrimary.label
              }) : null,
              hero.ctaSecondary ? el("a", {
                className: "btn btn-ghost",
                href: hero.ctaSecondary.href,
                text: hero.ctaSecondary.label
              }) : null
            ])
          ]),
          frame
        ]);

        const sections = (data.sections || []).map((s) => {
          const kids = [
            el("h2", { text: s.title }),
            el("p", { text: s.text })
          ];
          if (s.link) {
            kids.push(el("p", null, [
              el("a", {
                className: "inline",
                href: s.link.href,
                target: "_blank",
                rel: "noopener noreferrer",
                text: s.link.label
              })
            ]));
          }
          return el("section", { className: "section shell", id: s.id }, kids);
        });

        const tagsSection = el("div", { id: "tags" });
        if (PT) PT.renderTagsCloud(tagsSection);

        const faqItems = (data.faq || []).map((f) => {
          const d = el("details");
          d.appendChild(el("summary", { text: f.q }));
          d.appendChild(el("p", { text: f.a }));
          return d;
        });

        const faq = el("section", { className: "section shell faq", id: "faq" }, [
          el("h2", { text: "Частые вопросы про Водка Бет" }),
          el("div", null, faqItems)
        ]);

        const foot = data.footer || {};
        const footer = el("footer", null, [
          el("div", { className: "shell foot-row" }, [
            el("p", { text: foot.text || "" }),
            el("a", {
              href: foot.twitchHref || site.twitch,
              target: "_blank",
              rel: "noopener noreferrer",
              text: foot.twitchLabel || "Twitch Водка Бет"
            })
          ])
        ]);

        app.replaceChildren(header, heroNode, ...sections, faq, footer, tagsSection);

        const select = document.getElementById("lang-select");
        if (select) {
          select.addEventListener("change", () => openTranslate(select.value));
        }
      }

      function bootFromEmbed() {
        const raw = document.getElementById("page-data");
        if (!raw) throw new Error("no embedded page-data");
        return JSON.parse(raw.textContent);
      }

      fetch("index.json", { cache: "no-store" })
        .then((r) => {
          if (!r.ok) throw new Error("index.json not found");
          return r.json();
        })
        .then(render)
        .catch(() => {
          try {
            render(bootFromEmbed());
          } catch (err) {
            app.replaceChildren(el("p", {
              className: "shell status",
              text: "Не удалось загрузить данные страницы."
            }));
            console.error(err);
          }
        });
    })();
  </script>
</body>
</html>
